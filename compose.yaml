services:
  lan-pong-arena:
    build:
      context: .
      dockerfile: app.Dockerfile
    container_name: lan-pong-arena
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      AVATAR_STORAGE_DIR: /data/avatars
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
    volumes:
      - avatars_data:/data/avatars
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  avatars_data:
